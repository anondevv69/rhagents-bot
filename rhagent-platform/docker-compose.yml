version: "3.8"

services:
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file: .env
    volumes:
      - bot-data:/app/data
    ports:
      - "${PORT:-8090}:${PORT:-8090}"
    restart: unless-stopped
    depends_on:
      - dashboard

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  bot-data:
