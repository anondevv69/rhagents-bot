[build]
builder = "nixpacks"
buildCommand = "npm run build"

[deploy]
startCommand = "FONTCONFIG_FILE=/app/fonts/fonts.conf FONTCONFIG_PATH=/app/fonts npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.env]
VIEWER_GATE_ENABLED = "true"
DOCS_HOST = "docs.rhagent.bot"
NEXT_PUBLIC_DOCS_URL = "https://docs.rhagent.bot"
NEXT_PUBLIC_BASE_URL = "https://rhagent.bot"

[[volumes]]
mountPath = "/app/data"
