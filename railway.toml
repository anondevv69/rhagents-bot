[build]
builder = "nixpacks"
buildCommand = "npm run build"

[deploy]
startCommand = "FONTCONFIG_FILE=/app/fonts/fonts.conf FONTCONFIG_PATH=/app/fonts npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.env]
VIEWER_GATE_ENABLED = "true"

[[volumes]]
mountPath = "/app/data"
