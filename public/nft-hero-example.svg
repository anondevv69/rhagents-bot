     preserveAspectRatio="xMidYMid meet">
  <rect width="1600" height="700" fill="#000000"/>

  <text x="50%" y="50%"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif"
        font-weight="900"
        font-size="320"
        fill="#3a4a10"
        textLength="1360"
